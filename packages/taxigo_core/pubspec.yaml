name: taxigo_core
description: Shared TaxiGo package - API, models, theme, l10n, Firebase.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  dio: ^5.8.0+1
  dartz: ^0.10.1
  shared_preferences: ^2.5.3
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_database: ^11.3.5
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.1.0
  google_maps_flutter: ^2.12.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  pin_code_fields: ^8.0.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  assets:
    - assets/images/
    - assets/map/
