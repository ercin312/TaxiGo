name: taxigo_driver
description: TaxiGo driver mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  taxigo_core:
    path: ../../packages/taxigo_core

  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^14.8.1
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
