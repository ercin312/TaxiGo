name: taxigo
description: TaxiGo mobile application — passenger and driver in one app.
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  taxigo_core:
    path: ../../packages/taxigo_core

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^14.8.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_database: ^11.3.5
  firebase_messaging: ^15.2.5
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  pin_code_fields: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ../../packages/taxigologo.png
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: ../../packages/taxigologo.png

flutter:
  uses-material-design: true
