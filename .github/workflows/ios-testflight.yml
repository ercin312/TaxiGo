# iOS → TestFlight (GitHub Actions)
#
# Required secrets:
#   IOS_TEAM_ID
#   IOS_DISTRIBUTION_CERT_BASE64
#   IOS_DISTRIBUTION_CERT_PASSWORD
#   IOS_PROVISIONING_PROFILE_BASE64
#   IOS_PROVISIONING_PROFILE_NAME
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY   (raw .p8 PEM or base64)
#
# Optional vars:
#   TAXIGO_API_BASE_URL

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Override build number (optional, empty = from pubspec / run_number)"
        required: false
        default: ""

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/passenger

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      TAXIGO_API_BASE_URL: ${{ vars.TAXIGO_API_BASE_URL || 'https://api.taxigo.app/api/v1' }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify signing secrets
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          for v in IOS_TEAM_ID IOS_DISTRIBUTION_CERT_BASE64 IOS_DISTRIBUTION_CERT_PASSWORD \
                   IOS_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_NAME \
                   APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "::error::Missing secret: $v"
              exit 1
            fi
          done
          echo "Signing secrets present. Team=${#IOS_TEAM_ID} chars, profile name set."

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/taxigo.mobileprovision
          security cms -D -i /tmp/taxigo.mobileprovision > /tmp/taxigo_prov.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/taxigo_prov.plist)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/taxigo_prov.plist)
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/taxigo_prov.plist)
          echo "Profile Name=$NAME UUID=$UUID AppId=$APP_ID"
          cp /tmp/taxigo.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"

      - name: Apply CI signing patch
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_BUNDLE_ID: com.erhancinar.taxigo
        run: python3 tools/patch_ios_ci_signing.py

      - name: Install Flutter packages
        run: |
          flutter pub get
          cd ../../packages/taxigo_core
          flutter pub get
          flutter gen-l10n
          cd ../../apps/passenger
          flutter pub get

      - name: CocoaPods
        working-directory: apps/passenger/ios
        run: |
          set -euo pipefail
          export COCOAPODS_DISABLE_STATS=true
          gem install cocoapods
          pod install

      - name: Write App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          if echo "$ASC_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY" > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          else
            echo "$ASC_KEY" | base64 --decode > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          fi
          chmod 600 "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Resolve build number
        id: meta
        run: |
          set -euo pipefail
          BN="${{ github.event.inputs.build_number }}"
          if [ -z "$BN" ]; then
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
            BN="${VERSION#*+}"
          fi
          if [ -z "$BN" ]; then BN="${{ github.run_number }}"; fi
          echo "build_number=$BN" >> "$GITHUB_OUTPUT"
          echo "Using CFBundleVersion=$BN"

      - name: Build IPA
        env:
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions-ci.plist \
            --dart-define=TAXIGO_API_BASE_URL="${TAXIGO_API_BASE_URL}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: taxigo-ios-ipa
          path: apps/passenger/build/ios/ipa/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
