name: ASC Set Review Info

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Prefer this CFBundleVersion when selecting a build
        required: false
        default: "15"

jobs:
  set-review-info:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fix ASC metadata and submit
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: python3 scripts/asc_fix_and_submit.py
