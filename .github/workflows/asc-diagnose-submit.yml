name: ASC Diagnose Submit Blockers

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Diagnose ASC blockers
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, time, urllib.error, urllib.request, subprocess, sys
          subprocess.check_call([sys.executable, "-m", "pip", "install", "PyJWT", "cryptography", "-q"])
          import jwt as pyjwt

          key_id = os.environ["KEY_ID"].strip()
          issuer = os.environ["ISSUER_ID"].strip()
          raw = os.environ["API_KEY"].strip()
          pem = raw if "BEGIN PRIVATE KEY" in raw else base64.b64decode(raw).decode()
          if not pem.endswith("\n"):
              pem += "\n"

          def token():
              now = int(time.time())
              return pyjwt.encode(
                  {"iss": issuer, "iat": now, "exp": now + 1100, "aud": "appstoreconnect-v1"},
                  pem, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"},
              )

          def api(method, path, body=None, ok=(200, 201)):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com{path}",
                  data=data, method=method,
                  headers={
                      "Authorization": f"Bearer {token()}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      raw_body = r.read().decode()
                      return r.status, json.loads(raw_body) if raw_body else {}
              except urllib.error.HTTPError as e:
                  err = e.read().decode()
                  print(f"HTTP {e.code} {method} {path}\n{err[:4000]}")
                  if e.code in ok:
                      return e.code, json.loads(err) if err else {}
                  raise

          BUNDLE = "com.erhancinar.taxigo"
          _, apps = api("GET", f"/v1/apps?filter[bundleId]={BUNDLE}")
          app_id = apps["data"][0]["id"]
          print("APP", app_id)

          _, versions = api("GET", f"/v1/apps/{app_id}/appStoreVersions?filter[platform]=IOS&limit=5")
          version = versions["data"][0]
          version_id = version["id"]
          print("VERSION", version["attributes"])

          # Review detail
          _, rd = api("GET", f"/v1/appStoreVersions/{version_id}/appStoreReviewDetail")
          if rd.get("data"):
              print("REVIEW_DETAIL", json.dumps(rd["data"]["attributes"], indent=2)[:2000])

          # Build
          _, build_rel = api("GET", f"/v1/appStoreVersions/{version_id}/build", ok=(200, 404))
          print("ATTACHED_BUILD", json.dumps(build_rel.get("data"), indent=2)[:800] if build_rel.get("data") else None)

          # Localizations / what's required
          _, locs = api("GET", f"/v1/appStoreVersions/{version_id}/appStoreVersionLocalizations")
          for loc in locs.get("data", []):
              print("LOC", loc["id"], loc["attributes"].get("locale"),
                    "desc_len", len(loc["attributes"].get("description") or ""),
                    "kw", loc["attributes"].get("keywords"),
                    "whatsNew", bool(loc["attributes"].get("whatsNew")),
                    "support", loc["attributes"].get("supportUrl"),
                    "marketing", loc["attributes"].get("marketingUrl"),
                    "privacy", loc["attributes"].get("privacyPolicyUrl"))
              lid = loc["id"]
              _, shots = api("GET", f"/v1/appStoreVersionLocalizations/{lid}/appScreenshotSets", ok=(200,))
              for s in shots.get("data", []):
                  print("  SHOTSET", s["attributes"].get("screenshotDisplayType"), s["id"])
                  _, imgs = api("GET", f"/v1/appScreenshotSets/{s['id']}/appScreenshots")
                  print("    shots", len(imgs.get("data") or []))
              _, prev = api("GET", f"/v1/appStoreVersionLocalizations/{lid}/appPreviewSets", ok=(200,))
              print("  previewSets", len(prev.get("data") or []))

          # App info / age rating / content rights
          _, infos = api("GET", f"/v1/apps/{app_id}/appInfos")
          for info in infos.get("data", []):
              print("APPINFO", info["id"], info["attributes"])
              _, age = api("GET", f"/v1/appInfos/{info['id']}/ageRatingDeclaration", ok=(200, 404))
              if age.get("data"):
                  print("AGE", json.dumps(age["data"]["attributes"], indent=2)[:1500])
              _, rights = api("GET", f"/v1/appInfos/{info['id']}/?", ok=(200, 404))

          # Primary category etc via include
          for info in infos.get("data", []):
              _, full = api("GET", f"/v1/appInfos/{info['id']}?include=primaryCategory,secondaryCategory,primaryLocale,ageRatingDeclaration")
              print("APPINFO_FULL attrs", full.get("data", {}).get("attributes"))
              for inc in full.get("included") or []:
                  print("  included", inc["type"], inc.get("id"), list((inc.get("attributes") or {}).keys())[:8])

          # Encryption
          _, enc = api("GET", f"/v1/apps/{app_id}/appEncryptionDeclarations?limit=10", ok=(200,))
          for e in enc.get("data", []):
              print("ENC", e["id"], e["attributes"])

          # IDFA / advertising
          try:
              api("PATCH", f"/v1/appStoreVersions/{version_id}", {
                  "data": {
                      "type": "appStoreVersions",
                      "id": version_id,
                      "attributes": {"usesIdfa": False},
                  }
              })
              print("SET usesIdfa=false OK")
          except Exception as e:
              print("SET usesIdfa failed", e)

          # Review submissions deep dive
          _, subs = api("GET", f"/v1/apps/{app_id}/reviewSubmissions?filter[platform]=IOS&limit=10")
          for s in subs.get("data", []):
              sid = s["id"]
              print("SUB", sid, s["attributes"])
              _, items = api("GET", f"/v1/reviewSubmissions/{sid}/items", ok=(200, 404))
              for it in items.get("data") or []:
                  print("  ITEM", it["id"], it["attributes"])
              # Try cancel unresolved
              if s["attributes"].get("state") == "UNRESOLVED_ISSUES":
                  try:
                      api("PATCH", f"/v1/reviewSubmissions/{sid}", {
                          "data": {
                              "type": "reviewSubmissions",
                              "id": sid,
                              "attributes": {"canceled": True},
                          }
                      })
                      print("CANCELED unresolved submission", sid)
                  except Exception as e:
                      print("cancel failed", e)

          # Privacy / nutrition labels
          _, privacy = api("GET", f"/v1/apps/{app_id}/appPrivacyDetails?limit=5", ok=(200, 404))
          print("PRIVACY_DETAILS", privacy)

          # Availability / pricing
          _, avail = api("GET", f"/v1/apps/{app_id}/appAvailabilities", ok=(200, 404))
          print("AVAIL", avail.get("data"))
          _, price = api("GET", f"/v1/apps/{app_id}/appPriceSchedule", ok=(200, 404))
          print("PRICE", price.get("data"))

          # Final version state
          _, v2 = api("GET", f"/v1/appStoreVersions/{version_id}")
          print("FINAL_VERSION", v2["data"]["attributes"])

          # New submission attempt after cancel
          try:
              _, created = api("POST", "/v1/reviewSubmissions", {
                  "data": {
                      "type": "reviewSubmissions",
                      "attributes": {"platform": "IOS"},
                      "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
                  }
              })
              new_id = created["data"]["id"]
              print("NEW_SUB", new_id, created["data"]["attributes"])
              api("POST", "/v1/reviewSubmissionItems", {
                  "data": {
                      "type": "reviewSubmissionItems",
                      "relationships": {
                          "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": new_id}},
                          "appStoreVersion": {"data": {"type": "appStoreVersions", "id": version_id}},
                      },
                  }
              })
              print("ITEM linked to new sub")
              _, submitted = api("PATCH", f"/v1/reviewSubmissions/{new_id}", {
                  "data": {
                      "type": "reviewSubmissions",
                      "id": new_id,
                      "attributes": {"submitted": True},
                  }
              })
              print("SUBMITTED", submitted["data"]["attributes"])
          except Exception as e:
              print("NEW SUBMIT FLOW FAILED", e)

          _, versions2 = api("GET", f"/v1/apps/{app_id}/appStoreVersions?filter[platform]=IOS&limit=3")
          for v in versions2["data"]:
              print("END_STATE", v["attributes"].get("versionString"), v["attributes"].get("appStoreState"), v["attributes"].get("appVersionState"))
          print("DONE")
          PY
