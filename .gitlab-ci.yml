# TaxiGo — GitLab CI/CD
# Builds release APK from apps/passenger (unified TaxiGo app)

stages:
  - test
  - build

variables:
  FLUTTER_APP: apps/passenger
  FLUTTER_CORE: packages/taxigo_core
  # Override in GitLab CI/CD variables (Settings → CI/CD → Variables)
  TAXIGO_API_BASE_URL: "http://10.0.2.2:8000/api/v1"

default:
  image: ghcr.io/cirruslabs/flutter:stable
  before_script:
    - flutter --version
    - flutter pub get
    - cd "${FLUTTER_CORE}" && flutter pub get && flutter gen-l10n
    - cd "${CI_PROJECT_DIR}/${FLUTTER_APP}" && flutter pub get
  cache:
    key:
      files:
        - apps/passenger/pubspec.lock
        - packages/taxigo_core/pubspec.lock
    paths:
      - .pub-cache/
      - apps/passenger/.dart_tool/
      - packages/taxigo_core/.dart_tool/

flutter:analyze:
  stage: test
  script:
    - cd "${FLUTTER_CORE}" && flutter analyze
    - cd "${CI_PROJECT_DIR}/${FLUTTER_APP}" && flutter analyze lib
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

build:apk:
  stage: build
  script:
    - cd "${CI_PROJECT_DIR}/${FLUTTER_APP}"
    - flutter build apk --release --dart-define=TAXIGO_API_BASE_URL=${TAXIGO_API_BASE_URL}
  artifacts:
    name: taxigo-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
    paths:
      - apps/passenger/build/app/outputs/flutter-apk/app-release.apk
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

build:apk:split:
  stage: build
  script:
    - cd "${CI_PROJECT_DIR}/${FLUTTER_APP}"
    - flutter build apk --release --split-per-abi --dart-define=TAXIGO_API_BASE_URL=${TAXIGO_API_BASE_URL}
  artifacts:
    name: taxigo-split-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
    paths:
      - apps/passenger/build/app/outputs/flutter-apk/*-release.apk
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
